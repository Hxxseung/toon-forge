# w005 마마신 작은 손님 / SangFeel — 2026-11-12 검토
# 제외: 대장·선배·공자(일반 호칭), 년후·마을사람·눈동냥·숲속·술법·책임추궁·여자아이·인간출신(일반 명사),
#       그동안검술·둔갑술(띄어쓰기 없는 OCR 결과), sfx로 잘못 분류된 외침(재수없어!!!, 예?!, 어이구!!)
# 긴 이름이 먼저 치환됨: "이화인" → "윤서준" 다음에 "화인" → "서준"
version: "v1"

entities:
  person:
    "백은": "청아"          # 백은님 (4회)
    "이화인": "윤서준"      # 이화인공자
    "화인": "서준"          # 화인 공자님 (2회)
    "철현": "석진"          # '철현'이다!
    "흑제": "적룡"          # 흑제장군
  place:
    "된비알산": "검바위산"  # 된비알산의 악마
  item:
    "유혈목이": "먹구렁이"  # 신검 유혈목이 (뱀 이름을 딴 검)
  term:
    "마마신": "역병신"      # 8회 — "3대마마신"도 함께 바뀜
    "수령신": "산령신"      # '수령신'에게 들었다 (3회)
    "혼륜": "묵련"          # '혼륜'의 군단 (2회)

sfx: {}

credit:
  replace:
    "SangFeel": "누리"
  default_text: null